<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12271d"/>
      <stop offset="0.55" stop-color="#1b3a2c"/>
      <stop offset="1" stop-color="#274b39"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#3c6b4d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3c6b4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5d42"/><stop offset="1" stop-color="#1f4530"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7a52"/><stop offset="1" stop-color="#2b5a3c"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>

  <!-- big monstera-style leaves, back layer -->
  <g fill="url(#leafA)" opacity="0.85">
    <path d="M-40,780 C120,560 300,540 360,700 C300,690 250,720 240,790 C300,760 340,770 360,700 C420,760 400,900 300,900 L-40,900 Z"/>
    <path d="M1500,120 C1300,180 1180,320 1260,470 C1280,400 1330,360 1400,360 C1340,400 1320,450 1360,500 C1440,470 1500,360 1480,220 Z"/>
  </g>

  <!-- fronds, mid layer -->
  <g fill="url(#leafB)" opacity="0.9">
    <path d="M1300,900 C1240,700 1300,560 1460,520 C1420,600 1420,700 1480,760 C1440,720 1400,720 1380,760 C1440,780 1470,840 1460,900 Z"/>
    <path d="M120,60 C60,220 120,340 260,360 C220,300 220,240 260,200 C240,250 260,300 320,300 C300,200 240,110 120,60 Z"/>
  </g>

  <!-- delicate front leaves -->
  <g fill="#4c8a5e" opacity="0.75">
    <path d="M-20,60 C120,90 200,190 180,320 C150,250 100,210 40,210 C90,240 110,290 90,340 C10,300 -40,190 -20,60 Z"/>
  </g>
  <g fill="#5c9a6a" opacity="0.65">
    <path d="M1460,900 C1360,860 1290,760 1300,640 C1340,710 1400,740 1460,720 C1410,760 1400,820 1440,860 Z"/>
  </g>

  <!-- soft particles -->
  <g fill="#c9e2cd" opacity="0.5">
    <circle cx="520" cy="180" r="3"/><circle cx="820" cy="120" r="2"/>
    <circle cx="980" cy="240" r="2.5"/><circle cx="360" cy="300" r="2"/>
    <circle cx="1120" cy="360" r="2"/><circle cx="680" cy="80" r="2"/>
  </g>
</svg>
